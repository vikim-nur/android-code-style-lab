# Transport prototype, not an approved team policy. MagicNumber is a positive smoke control.
build:
  maxIssues: 0
config:
  validation: true
  excludes: 'Compose'
style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2']
Compose:
  active: true
  RememberMissing:
    active: true
  ViewModelForwarding:
    active: true
    allowedStateHolderNames: ['.*VM', '.*ViewModel', '.*Presenter']
  ViewModelInjection:
    active: true
    viewModelFactories: ['koinViewModel', 'hiltViewModel']
